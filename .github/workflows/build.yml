on:
  schedule:
    - cron: "0 0 * * */2" # midnight every 2 days
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - Containerfile
  workflow_dispatch:
jobs:
  build:
    name: Build and push ghcr.io/${{ github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      NAME: ghcr.io/${{ github.repository }}
    steps:
    - name: Maximise build space
      uses: ublue-os/remove-unwanted-software@v9
    - name: Log in to ghcr.io
      uses: redhat-actions/podman-login@v1
      with:
        username: ${{ github.actor }}
        password: ${{ github.token }}
        registry: ${{ env.REGISTRY }}
    - uses: actions/checkout@v7
    - name: Build ghcr.io/${{ github.repository }}:latest
      run: make build NAME=${{ env.NAME }} EXTRA_BUILD_ARGS="--label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
    - name: Run chunkah
      run: make rechunk NAME=${{ env.NAME }}
    - name: Tag Git commit
      run: podman tag ${{ env.NAME }}:latest ${{ env.NAME }}:$(git rev-parse HEAD)
    - name: Push Git commit
      run: podman push ${{ env.NAME }}:$(git rev-parse HEAD)
    - name: Push latest
      run: podman push ${{ env.NAME }}:latest
